name: Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract short SHA
      id: vars
      run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build -t ${{ vars.DOCKER_USERNAME }}/my-ml-project:latest .
        docker tag ${{ vars.DOCKER_USERNAME }}/my-ml-project:latest ${{ vars.DOCKER_USERNAME }}/my-ml-project:${SHA}

    - name: Push Docker image
      run: |
        docker push ${{ vars.DOCKER_USERNAME }}/my-ml-project:latest
        docker push ${{ vars.DOCKER_USERNAME }}/my-ml-project:${SHA}
